name: Kontext Integration Patch

on:
  push:
    branches: [main]
    paths:
      - KONTEXT_TRIGGER.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.js
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.js")
          s = p.read_text(encoding="utf-8")

          if 'key: "edit"' in s and 'fal-ai/flux-pro/kontext' in s and 'command === "/edit"' in s:
              print("Kontext Pro patch already present; nothing to do.")
              raise SystemExit(0)

          pattern = r'  shark: \{.*?\n  \}\n};'
          replacement = '''  edit: {
    key: "edit",
    label:
      "✏️ Pixlemeta EDIT (Premium Edit)",
    type: "i2i",
    qualities: {
      "2k": {
        cost: 15
      },
      "4k": {
        cost: 25
      },
      "8k": {
        cost: 45
      }
    },
    engines: {
      primary: "kontext_pro_edit",
      backup: null
    }
  }
};'''
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("Could not replace SHARK model definition")

          s = s.replace('async function sharkV1EditPipeline(', 'async function kontextProEditPipeline(', 1)

          old_call = '''      "fal-ai/flux/dev/image-to-image",
      {
        image_url: imageUrl,
        prompt,
        strength: 0.75,
        num_images: 1
      }'''
          new_call = '''      "fal-ai/flux-pro/kontext",
      {
        image_url: imageUrl,
        prompt,
        num_images: 1,
        output_format: "jpeg"
      }'''
          if old_call not in s:
              raise SystemExit("Could not find old SHARK FAL call")
          s = s.replace(old_call, new_call, 1)
          s = s.replace('"SHARK V1 returned no image"', '"Pixlemeta EDIT returned no image"', 1)

          old_upscale = '''
  if (qualityKey === "8k") {
    url = await falTopazUpscale(
      url,
      4
    );
  }
'''
          s = s.replace(old_upscale, "\n", 1)

          s = s.replace('case "shark_v1_edit":\n      return sharkV1EditPipeline(', 'case "kontext_pro_edit":\n      return kontextProEditPipeline(', 1)

          s = s.replace('lower.includes(\n      "shark"\n    )', 'lower.includes(\n      "edit"\n    )')
          s = s.replace('modelKey =\n      "shark";', 'modelKey =\n      "edit";')
          s = s.replace('modelKey === "shark"', 'modelKey === "edit"')
          s = s.replace('async function cmdShark(', 'async function cmdEdit(', 1)
          s = s.replace('/^\\/shark/i', '/^\\/edit/i')
          s = s.replace('`🦈 SHARK V1\\n\\n`', '`✏️ PIXLEMETA EDIT\\n\\n`')
          s = s.replace('`🦈 SHARK V1 requires an image.', '`✏️ PIXLEMETA EDIT requires an image.')
          s = s.replace('`/shark <edit instruction>`', '`/edit <edit instruction>`')
          s = s.replace('`shark:${userId}:image`', '`edit:${userId}:image`')
          s = s.replace('"shark",\n    "4k",', '"edit",\n    "4k",')
          s = s.replace('PHOTO / SHARK', 'PHOTO / EDIT')
          s = s.replace('"🦈 Pixlemeta SHARK V1"', '"✏️ Pixlemeta EDIT"')
          s = s.replace('`🦈 SHARK V1 — PREMIUM EDIT\\n\\n`', '`✏️ PIXLEMETA EDIT — PREMIUM EDIT\\n\\n`')
          s = s.replace('command === "/shark"', 'command === "/edit"')
          s = s.replace('return cmdShark(', 'return cmdEdit(')
          s = s.replace('"shark"', '"edit"')

          p.write_text(s, encoding="utf-8")
          PY

      - name: Validate
        run: |
          node --check index.js
          grep -q 'key: "edit"' index.js
          grep -q 'fal-ai/flux-pro/kontext' index.js
          grep -q 'kontext_pro_edit' index.js
          grep -q 'command === "/edit"' index.js
          ! grep -q 'shark_v1_edit' index.js
          ! grep -q 'command === "/shark"' index.js

      - name: Commit patch
        run: |
          if git diff --quiet -- index.js; then
            echo "No index.js changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git commit -m "feat: replace SHARK with Pixlemeta EDIT (Kontext Pro)"
          git push
