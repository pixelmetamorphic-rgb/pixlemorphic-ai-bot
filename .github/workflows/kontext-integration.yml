name: Kontext Integration Patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace SHARK with Kontext Pro
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.js")
          s = p.read_text(encoding="utf-8")

          if 'key: "edit"' in s and 'fal-ai/flux-pro/kontext' in s and 'command === "/edit"' in s:
              print("Already patched")
              raise SystemExit(0)

          # Model block
          pattern = r'  shark: \{.*?\n  \}\n};'
          replacement = '''  edit: {
    key: "edit",
    label:
      "✏️ Pixlemeta EDIT (Premium Edit)",
    type: "i2i",
    qualities: {
      "2k": { cost: 15 },
      "4k": { cost: 25 },
      "8k": { cost: 45 }
    },
    engines: {
      primary: "kontext_pro_edit",
      backup: null
    }
  }
};'''
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("SHARK model block not found")

          # Pipeline + provider
          s = s.replace("async function sharkV1EditPipeline(", "async function kontextProEditPipeline(", 1)
          s = s.replace('"fal-ai/flux/dev/image-to-image"', '"fal-ai/flux-pro/kontext"', 1)
          s = s.replace('''        strength: 0.75,\n        num_images: 1''', '''        num_images: 1,\n        output_format: "jpeg"''', 1)
          s = s.replace('"SHARK V1 returned no image"', '"Pixlemeta EDIT returned no image"', 1)
          s = re.sub(r'\n  if \(qualityKey === "8k"\) \{\n    url = await falTopazUpscale\(\n      url,\n      4\n    \);\n  \}\n', '\n', s, count=1)
          s = s.replace('case "shark_v1_edit":\n      return sharkV1EditPipeline(', 'case "kontext_pro_edit":\n      return kontextProEditPipeline(', 1)

          # Quick generation inference
          s = s.replace('lower.includes(\n      "shark"\n    )', 'lower.includes(\n      "edit"\n    )', 1)
          s = s.replace('modelKey =\n      "shark";', 'modelKey =\n      "edit";', 1)
          s = s.replace('modelKey === "shark"', 'modelKey === "edit"', 1)

          # Rename command handler and user flow
          s = s.replace('async function cmdShark(', 'async function cmdEdit(', 1)
          s = s.replace('/^\\/shark/i', '/^\\/edit/i', 1)
          s = s.replace('`🦈 SHARK V1\\n\\n`', '`✏️ PIXLEMETA EDIT\\n\\n`', 1)
          s = s.replace('`🦈 SHARK V1 requires an image.', '`✏️ PIXLEMETA EDIT requires an image.', 1)
          s = s.replace('`/shark <edit instruction>`', '`/edit <edit instruction>`')
          s = s.replace('`shark:${userId}:image`', '`edit:${userId}:image`')
          s = s.replace('"shark",\n    "4k",', '"edit",\n    "4k",', 1)
          s = s.replace('PHOTO / SHARK', 'PHOTO / EDIT', 1)
          s = s.replace('"🦈 Pixlemeta SHARK V1"', '"✏️ Pixlemeta EDIT"', 1)
          s = s.replace('`🦈 SHARK V1 — PREMIUM EDIT\\n\\n`', '`✏️ PIXLEMETA EDIT — PREMIUM EDIT\\n\\n`', 1)
          s = s.replace('command === "/shark"', 'command === "/edit"', 1)
          s = s.replace('return cmdShark(', 'return cmdEdit(', 1)
          s = s.replace('"shark"', '"edit"')

          p.write_text(s, encoding="utf-8")
          PY

      - name: Validate
        run: |
          node --check index.js
          grep -q 'key: "edit"' index.js
          grep -q 'fal-ai/flux-pro/kontext' index.js
          grep -q 'kontext_pro_edit' index.js
          grep -q 'command === "/edit"' index.js
          ! grep -q 'shark_v1_edit' index.js

      - name: Commit patched index.js
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: replace SHARK with Pixlemeta EDIT (Kontext Pro)"
          git push
